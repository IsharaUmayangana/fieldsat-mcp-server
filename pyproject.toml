[project]
name = "fieldsat"
version = "0.1.0"
description = "Field-level satellite and weather evidence for AgriVibe, served over MCP with FastMCP"
readme = "README.md"
authors = [
    { name = "Ishara Umayangana", email = "isharaumayangana27@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
]

[project.scripts]
live-demo = "fieldsat.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
